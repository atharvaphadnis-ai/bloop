<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bloop — Your backend. Your rules. Your database.</title>
  <meta name="description" content="Bloop — self-hosted Backend-as-a-Service. Database, auth, storage, realtime, functions.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <!-- ══ Auth / setup screen ══ -->
    <section id="auth-screen" class="auth-screen hidden" aria-label="Sign in">
      <div class="auth-hero">
        <div class="auth-brand">
          <img src="assets/logo.png" alt="Bloop logo" class="auth-logo">
          <h1 class="auth-title">Bloop</h1>
          <p class="auth-tagline">Your backend. Your rules. Your database.</p>
        </div>
        <div class="auth-card">
          <div id="auth-forms"><!-- rendered by app.js --></div>
        </div>
        <div class="auth-footer">
          <span>Self-hosted · zero telemetry · pure Node.js</span>
        </div>
      </div>
    </section>

    <!-- ══ Application shell ══ -->
    <div id="shell" class="shell hidden">
      <header class="topbar" id="topbar">
        <div class="topbar-left">
          <button class="brand" id="brand-btn" title="Overview">
            <img src="assets/logo.png" alt="" class="brand-logo">
            <span class="brand-name">Bloop</span>
          </button>
          <span class="crumb-sep">/</span>
          <div class="dropdown" id="org-switcher">
            <button class="crumb-btn" id="org-btn" aria-haspopup="listbox">
              <svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span id="org-name">Organization</span>
              <svg class="icon chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="dropdown-menu" id="org-menu" role="listbox"></div>
          </div>
          <span class="crumb-sep">/</span>
          <div class="dropdown" id="project-switcher">
            <button class="crumb-btn" id="project-btn" aria-haspopup="listbox">
              <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
              <span id="project-name">Project</span>
              <svg class="icon chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="dropdown-menu" id="project-menu" role="listbox"></div>
          </div>
          <div class="dropdown" id="env-switcher">
            <button class="crumb-btn env-btn" id="env-btn" aria-haspopup="listbox">
              <span class="branch-name" id="env-name">main</span>
              <span class="badge badge-env" id="env-badge">PRODUCTION</span>
              <svg class="icon chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="dropdown-menu" id="env-menu" role="listbox"></div>
          </div>
          <button class="btn btn-ghost btn-sm topbar-connect" id="connect-btn" title="Connection info & API keys">
            <svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            Connect
          </button>
        </div>
        <div class="topbar-right">
          <button class="search-btn" id="search-btn">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <span>Search…</span>
            <kbd>Ctrl K</kbd>
          </button>
          <button class="icon-btn" id="theme-btn" title="Toggle theme">
            <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.3 11.3 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
          <div class="dropdown" id="user-menu-wrap">
            <button class="avatar-btn" id="user-avatar" title="Account">
              <span id="user-initial">?</span>
            </button>
            <div class="dropdown-menu dropdown-right" id="user-menu"></div>
          </div>
        </div>
      </header>

      <div class="layout">
        <aside class="sidebar" id="sidebar"><!-- rendered by sidebar.js --></aside>
        <div class="sidebar-resizer" id="sidebar-resizer" title="Drag to resize"></div>
        <main class="main" id="main">
          <div class="breadcrumbs" id="breadcrumbs"></div>
          <div class="page" id="page"><!-- rendered by router --></div>
        </main>
      </div>
    </div>

    <!-- overlays -->
    <div id="command-palette" class="cmdk-overlay hidden">
      <div class="cmdk" role="dialog" aria-label="Command palette">
        <input id="cmdk-input" type="text" placeholder="Type a command or search…" autocomplete="off" spellcheck="false">
        <div id="cmdk-results" class="cmdk-results"></div>
        <div class="cmdk-footer"><span>↑↓ navigate</span><span>↵ select</span><span>esc close</span></div>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="tooltip-root"></div>
    <div id="context-menu-root"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
